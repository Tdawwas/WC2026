             "accounts",   "Corporate Budget",
             "proj-all",   "Project Budget",
             "proj-depts", "Project Budget",
             "proj-dept",  "Project Budget",
             "projects",   "Project Budget",
             "transfer",   "Actions",
             ""
           )
    Color: =RGBA(168, 156, 142, 1)
    Size: =10
