      Size: =13
      FontWeight: =FontWeight.Bold
      Align: =Align.Center
      Color: =If(
               ThisItem.YTD = 0 || ThisItem.Act/ThisItem.YTD < 0.5, RGBA(163, 45, 45, 1),
               ThisItem.Act/ThisItem.YTD < 0.8, RGBA(176, 122, 30, 1),
               RGBA(59, 109, 17, 1)
             )

    AccStatusBadge:
      Type: Label
      X: =1055
      Y: =12
      Width: =90
      Height: =26
      BorderRadius: =13
      Text: =If(
               ThisItem.YTD = 0 || ThisItem.Act/ThisItem.YTD < 0.5, "Significant",
               ThisItem.Act/ThisItem.YTD < 0.8, "Moderate",
               "On track"
             )
      Color: =White
      FontWeight: =FontWeight.Bold
      Size: =10
      Align: =Align.Center
      Fill: =If(
               ThisItem.YTD = 0 || ThisItem.Act/ThisItem.YTD < 0.5, RGBA(163, 45, 45, 1),
               ThisItem.Act/ThisItem.YTD < 0.8, RGBA(176, 122, 30, 1),
               RGBA(59, 109, 17, 1)
             )

    AccRowDivider:
      Type: Rectangle
      Y: =50
      Width: =Parent.Width
      Height: =1
      Fill: =RGBA(228, 221, 210, 1)

