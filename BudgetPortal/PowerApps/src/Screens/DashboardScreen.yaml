##
## Screen: DashboardScreen
## Main portal — replaces all 8 pages of the HTML app:
##   npo-overview, corp-all-ov, corp-all-depts, proj-all-ov,
##   proj-all-depts, corp-ov, accounts, proj-ov, projects, transfer
##
## Uses context variables:
##   SelectedView  – which dept/scope the user logged in as
##   ActivePage    – which inner page is currently showing
##   SelectedDept  – dept currently drilled into
##   SelectedItem  – account or project clicked for detail panel
##

DashboardScreen:
  Fill: =RGBA(245, 242, 236, 1)

  OnVisible: |
    =/* Set the starting page based on login selection */
    Switch(
      SelectedView,
      "NPO — Full Organization View",      UpdateContext({ActivePage:"npo",      SelectedDept:"",  ViewType:"npo"}),
      "All Corporate Departments",          UpdateContext({ActivePage:"corp-all",  SelectedDept:"",  ViewType:"corp"}),
      "All Projects",                       UpdateContext({ActivePage:"proj-all",  SelectedDept:"",  ViewType:"proj"}),
      "── CORPORATE ──",                   UpdateContext({ActivePage:"corp-all",  SelectedDept:"",  ViewType:"corp"}),
      /* single corp dept */
      StartsWith(SelectedView,"Enablement (Corp)"),          UpdateContext({ActivePage:"corp-dept", SelectedDept:"Enablement",              ViewType:"corp"}),
      UpdateContext({ActivePage:"corp-dept", SelectedDept:SelectedView, ViewType:"corp"})
    );
    /* Simplification: map remaining project depts */
    If(SelectedView = "Activation",                UpdateContext({ActivePage:"proj-dept", SelectedDept:"Activation",          ViewType:"proj"}));
    If(SelectedView = "Creative",                  UpdateContext({ActivePage:"proj-dept", SelectedDept:"Creative",            ViewType:"proj"}));
    If(SelectedView = "Enablement (Proj)",         UpdateContext({ActivePage:"proj-dept", SelectedDept:"Enablement",          ViewType:"proj"}));
    If(SelectedView = "Strategic Initiatives (Proj)", UpdateContext({ActivePage:"proj-dept", SelectedDept:"Strategic Initiatives", ViewType:"proj"}));
    If(SelectedView = "Strategic Initiatives (Corp)", UpdateContext({ActivePage:"corp-dept", SelectedDept:"Strategic Initiatives", ViewType:"corp"}));
    If(SelectedView = "Financial Affairs",         UpdateContext({ActivePage:"corp-dept", SelectedDept:"Financial Affairs",   ViewType:"corp"}));
    If(SelectedView = "Human Resources",           UpdateContext({ActivePage:"corp-dept", SelectedDept:"Human Resources",     ViewType:"corp"}));
    If(SelectedView = "Information Technology",    UpdateContext({ActivePage:"corp-dept", SelectedDept:"Information Technology", ViewType:"corp"}));
    If(SelectedView = "Legal Affairs",             UpdateContext({ActivePage:"corp-dept", SelectedDept:"Legal Affairs",       ViewType:"corp"}));
    If(SelectedView = "Logistics & General Services", UpdateContext({ActivePage:"corp-dept", SelectedDept:"Logistics & General Services", ViewType:"corp"}));
    If(SelectedView = "Organization Development",  UpdateContext({ActivePage:"corp-dept", SelectedDept:"Organization Development", ViewType:"corp"}));
    UpdateContext({SelectedItem: Blank()})

