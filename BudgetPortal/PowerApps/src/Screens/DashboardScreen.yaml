  ##══ TRANSFER REQUEST FORM ═══════════════════════════════════════
  ## Mirrors the HTML transfer form exactly — sends mailto to Tawfiq.Nayef@npo.ae

  TransferFormContainer:
    Type: GroupContainer
    X: =228
    Y: =152
    Width: =Parent.Width - 248
    Height: =Parent.Height - 168
    Visible: =ActivePage = "transfer"

    TransferCard:
      Type: Rectangle
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =White
      BorderRadius: =14
      BorderColor: =RGBA(228, 221, 210, 1)
      BorderThickness: =1
      DropShadow: =DropShadow.Light

    # Type selector
    TypeLabel:
      Type: Label
      X: =24
      Y: =20
      Width: =200
      Height: =18
      Text: ="BUDGET TYPE"
      Size: =11
      FontWeight: =FontWeight.Bold
      Color: =RGBA(122, 110, 101, 1)

    TypeDropdown:
      Type: Dropdown
      X: =24
      Y: =38
      Width: =200
      Height: =36
      Items: =["All", "Corporate", "Projects"]
      Default: ="All"

    # From/To header
    FromHeaderLabel:
      Type: Label
      X: =24
      Y: =90
      Width: =280
      Height: =22
      Text: ="← Transfer From"
      FontWeight: =FontWeight.Bold
      Color: =RGBA(122, 110, 101, 1)
      Size: =12
      BorderColor: =RGBA(228, 221, 210, 1)

    ArrowLabel:
      Type: Label
      X: =324
      Y: =86
      Width: =40
      Height: =30
      Text: ="→"
      Align: =Align.Center
      Size: =18
      Color: =RGBA(168, 156, 142, 1)

    ToHeaderLabel:
      Type: Label
      X: =374
      Y: =90
      Width: =280
      Height: =22
      Text: ="Transfer To →"
      FontWeight: =FontWeight.Bold
      Color: =RGBA(122, 110, 101, 1)
      Size: =12

    # From Department
    FromDeptLabel:
      Type: Label
      X: =24
      Y: =124
      Width: =280
      Height: =18
      Text: ="FROM — DEPARTMENT"
      Size: =11
      FontWeight: =FontWeight.Bold
      Color: =RGBA(122, 110, 101, 1)

    FromDeptDropdown:
      Type: Dropdown
      X: =24
      Y: =142
      Width: =280
      Height: =36
      Items: =If(TypeDropdown.Selected.Value = "Projects",
               AddColumns(Distinct(ProjItems, Dept), "Label", Result & " (Projects)"),
               If(TypeDropdown.Selected.Value = "Corporate",
                 AddColumns(CorpDeptSummary, "Label", Dept & " (CC " & CC & ")"),
                 /* All */
                 Ungroup(Table(
                   {Items: AddColumns(CorpDeptSummary, "Label", Dept & " (CC " & CC & ")")},
                   {Items: AddColumns(Distinct(ProjItems, Dept), "Label", Result & " (Projects)")}
                 ), "Items")
               )
             )

    # From Account/Project
    FromAccLabel:
      Type: Label
      X: =24
      Y: =190
      Width: =280
      Height: =18
      Text: ="FROM — ACCOUNT / PROJECT"
      Size: =11
      FontWeight: =FontWeight.Bold
      Color: =RGBA(122, 110, 101, 1)

    FromAccDropdown:
      Type: Dropdown
      X: =24
      Y: =208
      Width: =280
      Height: =36
      Items: =If(
               StartsWith(FromDeptDropdown.Selected.Value, "CC") || LookUp(CorpDeptSummary, Dept = First(Split(FromDeptDropdown.Selected.Value," (CC")).Value) <> Blank(),
               AddColumns(Filter(CorpAccounts, Dept = First(Split(FromDeptDropdown.Selected.Value," (CC")).Value), "Label", Code & " — " & Desc),
               AddColumns(Filter(ProjItems,    Dept = First(Split(FromDeptDropdown.Selected.Value," (Proj")).Value), "Label", Code & " — " & Desc)
             ))

    # To Department
    ToDeptLabel:
      Type: Label
      X: =374
      Y: =124
      Width: =280
      Height: =18
      Text: ="TO — DEPARTMENT"
      Size: =11
      FontWeight: =FontWeight.Bold
      Color: =RGBA(122, 110, 101, 1)

    ToDeptDropdown:
      Type: Dropdown
      X: =374
      Y: =142
      Width: =280
      Height: =36
      Items: =FromDeptDropdown.Items

    # To Account/Project
    ToAccLabel:
      Type: Label
      X: =374
      Y: =190
      Width: =280
      Height: =18
      Text: ="TO — ACCOUNT / PROJECT"
      Size: =11
      FontWeight: =FontWeight.Bold
      Color: =RGBA(122, 110, 101, 1)

    ToAccDropdown:
      Type: Dropdown
      X: =374
      Y: =208
      Width: =280
      Height: =36
      Items: =If(
               StartsWith(ToDeptDropdown.Selected.Value, "CC") || LookUp(CorpDeptSummary, Dept = First(Split(ToDeptDropdown.Selected.Value," (CC")).Value) <> Blank(),
               AddColumns(Filter(CorpAccounts, Dept = First(Split(ToDeptDropdown.Selected.Value," (CC")).Value), "Label", Code & " — " & Desc),
               AddColumns(Filter(ProjItems,    Dept = First(Split(ToDeptDropdown.Selected.Value," (Proj")).Value), "Label", Code & " — " & Desc)
             ))

    # Amount
    AmountLabel:
      Type: Label
      X: =24
      Y: =260
      Width: =200
      Height: =18
      Text: ="AMOUNT (AED)"
      Size: =11
      FontWeight: =FontWeight.Bold
      Color: =RGBA(122, 110, 101, 1)

    AmountInput:
      Type: TextInput
      X: =24
      Y: =278
      Width: =200
      Height: =36
      PlaceholderText: ="e.g. 50,000"
      Format: =TextFormat.Number
      BorderRadius: =6
      BorderColor: =RGBA(228, 221, 210, 1)

    # Monthly cash flow (Jan–Dec)
    CashflowLabel:
      Type: Label
      X: =24
      Y: =330
      Width: =Parent.Width - 48
      Height: =18
      Text: ="MONTHLY CASH FLOW (AED) — must total the transfer amount"
      Size: =11
      FontWeight: =FontWeight.Bold
      Color: =RGBA(122, 110, 101, 1)

    MonthJan:
      Type: TextInput
      X: =24
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="Jan"
      Format: =TextFormat.Number
      BorderRadius: =6

    MonthFeb:
      Type: TextInput
      X: =104
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="Feb"
      Format: =TextFormat.Number
      BorderRadius: =6

    MonthMar:
      Type: TextInput
      X: =184
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="Mar"
      Format: =TextFormat.Number
      BorderRadius: =6

    MonthApr:
      Type: TextInput
      X: =264
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="Apr"
      Format: =TextFormat.Number
      BorderRadius: =6

    MonthMay:
      Type: TextInput
      X: =344
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="May"
      Format: =TextFormat.Number
      BorderRadius: =6

    MonthJun:
      Type: TextInput
      X: =424
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="Jun"
      Format: =TextFormat.Number
      BorderRadius: =6

    MonthJul:
      Type: TextInput
      X: =504
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="Jul"
      Format: =TextFormat.Number
      BorderRadius: =6

    MonthAug:
      Type: TextInput
      X: =584
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="Aug"
      Format: =TextFormat.Number
      BorderRadius: =6

    MonthSep:
      Type: TextInput
      X: =664
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="Sep"
      Format: =TextFormat.Number
      BorderRadius: =6

    MonthOct:
      Type: TextInput
      X: =744
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="Oct"
      Format: =TextFormat.Number
      BorderRadius: =6

    MonthNov:
      Type: TextInput
      X: =824
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="Nov"
      Format: =TextFormat.Number
      BorderRadius: =6

    MonthDec:
      Type: TextInput
      X: =904
      Y: =350
      Width: =70
      Height: =32
      PlaceholderText: ="Dec"
      Format: =TextFormat.Number
      BorderRadius: =6

    CashflowTotal:
      Type: Label
      X: =24
      Y: =390
      Width: =400
      Height: =22
      Text: ="Distributed: AED " &
             Text(
               (Value(MonthJan.Text)+Value(MonthFeb.Text)+Value(MonthMar.Text)+Value(MonthApr.Text)+
                Value(MonthMay.Text)+Value(MonthJun.Text)+Value(MonthJul.Text)+Value(MonthAug.Text)+
                Value(MonthSep.Text)+Value(MonthOct.Text)+Value(MonthNov.Text)+Value(MonthDec.Text)),
               "#,##0"
             ) & " of AED " & Text(Value(AmountInput.Text),"#,##0") &
             If(
               Round(Value(MonthJan.Text)+Value(MonthFeb.Text)+Value(MonthMar.Text)+Value(MonthApr.Text)+
                     Value(MonthMay.Text)+Value(MonthJun.Text)+Value(MonthJul.Text)+Value(MonthAug.Text)+
                     Value(MonthSep.Text)+Value(MonthOct.Text)+Value(MonthNov.Text)+Value(MonthDec.Text),0) =
               Round(Value(AmountInput.Text),0) && Value(AmountInput.Text) > 0,
               "  ✓ matches",
               If(Value(AmountInput.Text)>0," (must equal the amount)","")
             )
      Color: =If(
               Round(Value(MonthJan.Text)+Value(MonthFeb.Text)+Value(MonthMar.Text)+Value(MonthApr.Text)+
                     Value(MonthMay.Text)+Value(MonthJun.Text)+Value(MonthJul.Text)+Value(MonthAug.Text)+
                     Value(MonthSep.Text)+Value(MonthOct.Text)+Value(MonthNov.Text)+Value(MonthDec.Text),0) =
               Round(Value(AmountInput.Text),0) && Value(AmountInput.Text) > 0,
               RGBA(59, 109, 17, 1),
               RGBA(163, 45, 45, 1)
             )
      FontWeight: =FontWeight.Semibold
      Size: =12

    # Requested By
    NameLabel:
      Type: Label
      X: =24
      Y: =424
      Width: =280
      Height: =18
      Text: ="REQUESTED BY"
      Size: =11
      FontWeight: =FontWeight.Bold
      Color: =RGBA(122, 110, 101, 1)

    NameInput:
      Type: TextInput
      X: =24
      Y: =442
      Width: =280
      Height: =36
      Default: =User().FullName
      PlaceholderText: ="Your full name"
      BorderRadius: =6
      BorderColor: =RGBA(228, 221, 210, 1)

    # Justification
    JustLabel:
      Type: Label
      X: =24
      Y: =492
      Width: =Parent.Width - 48
      Height: =18
      Text: ="JUSTIFICATION"
      Size: =11
      FontWeight: =FontWeight.Bold
      Color: =RGBA(122, 110, 101, 1)

    JustInput:
      Type: TextInput
      X: =24
      Y: =510
      Width: =Parent.Width - 48
      Height: =80
      Mode: =TextMode.MultiLine
      PlaceholderText: ="Explain why this budget transfer is needed..."
      BorderRadius: =6
      BorderColor: =RGBA(228, 221, 210, 1)

    # Submit Button — builds mailto just like the HTML version
    SubmitButton:
      Type: Button
      X: =24
      Y: =608
      Width: =Parent.Width - 48
      Height: =48
      Text: ="⟶  Submit Transfer Request"
      Fill: =RGBA(44, 36, 32, 1)
      Color: =White
      BorderRadius: =10
      FontWeight: =FontWeight.Bold
      Size: =14
      OnSelect: |
        =If(
          IsBlank(FromDeptDropdown.Selected.Value) || IsBlank(FromAccDropdown.Selected.Value) ||
          IsBlank(ToDeptDropdown.Selected.Value)   || IsBlank(ToAccDropdown.Selected.Value)   ||
          IsBlank(AmountInput.Text) || IsBlank(NameInput.Text) || IsBlank(JustInput.Text),
          Notify("Please fill in all fields before submitting.", NotificationType.Warning),

          /* Validate cashflow totals match amount */
          If(
            Round(Value(MonthJan.Text)+Value(MonthFeb.Text)+Value(MonthMar.Text)+Value(MonthApr.Text)+
                  Value(MonthMay.Text)+Value(MonthJun.Text)+Value(MonthJul.Text)+Value(MonthAug.Text)+
                  Value(MonthSep.Text)+Value(MonthOct.Text)+Value(MonthNov.Text)+Value(MonthDec.Text),0) <>
            Round(Value(AmountInput.Text),0),
            Notify("The monthly cash flow must total the transfer amount.", NotificationType.Warning),

            /* Build email body and open mail client */
            Launch(
              "mailto:Tawfiq.Nayef@npo.ae?subject=" &
              EncodeUrl("Budget Transfer Request — " & FromDeptDropdown.Selected.Value & " → " & ToDeptDropdown.Selected.Value) &
              "&body=" &
              EncodeUrl(
                "BUDGET TRANSFER REQUEST" & Char(13) & Char(10) & Char(13) & Char(10) &
                "Budget type: "      & TypeDropdown.Selected.Value & Char(13) & Char(10) &
                "From department: "  & FromDeptDropdown.Selected.Value & Char(13) & Char(10) &
                "From account/project: " & FromAccDropdown.Selected.Value & Char(13) & Char(10) &
                "To department: "    & ToDeptDropdown.Selected.Value & Char(13) & Char(10) &
                "To account/project: " & ToAccDropdown.Selected.Value & Char(13) & Char(10) &
                "Amount (AED): "     & AmountInput.Text & Char(13) & Char(10) &
                "Monthly cash flow: Jan " & MonthJan.Text & " | Feb " & MonthFeb.Text & " | Mar " & MonthMar.Text &
                " | Apr " & MonthApr.Text & " | May " & MonthMay.Text & " | Jun " & MonthJun.Text &
                " | Jul " & MonthJul.Text & " | Aug " & MonthAug.Text & " | Sep " & MonthSep.Text &
                " | Oct " & MonthOct.Text & " | Nov " & MonthNov.Text & " | Dec " & MonthDec.Text & Char(13) & Char(10) &
                "Requested by: "     & NameInput.Text & Char(13) & Char(10) & Char(13) & Char(10) &
                "Justification:" & Char(13) & Char(10) & JustInput.Text
              )
            );
            Notify("Request email is ready — click Send in your mail app to submit to Budgeting.", NotificationType.Success)
          )
        )

    SuccessMsg:
      Type: Label
      X: =24
      Y: =665
      Width: =Parent.Width - 48
      Height: =30
      Text: ="✓  Your request email is ready — click Send in your mail app to submit it to Budgeting."
      Fill: =RGBA(236, 241, 230, 1)
      Color: =RGBA(59, 109, 17, 1)
      BorderRadius: =8
      Size: =13
      FontWeight: =FontWeight.Medium
      Visible: =false   # set to true after submit via UpdateContext
