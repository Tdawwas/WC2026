  PageSub:
    Type: Label
    X: =248
    Y: =124
    Width: =Parent.Width - 280
    Height: =20
    Text: =Switch(ActivePage,
             "npo",        "FY2026 — Corporate + Projects combined · As of May 2026",
             "corp-all",   "FY2026 — All corporate departments combined",
             "corp-depts", "Choose a department to drill into its accounts",
             "corp-dept",  "Cost Center " & LookUp(CorpDeptSummary, Dept=SelectedDept, CC) & " · FY2026",
             "accounts",   With({r:LookUp(CorpDeptSummary,Dept=SelectedDept)}, Text(r.Accounts,"[$-en]0") & " accounts · CC " & r.CC),
             "proj-all",   "FY2026 — All active projects combined",
             "proj-depts", "Choose a department to drill into its projects",
             "proj-dept",  Text(CountRows(Filter(ProjItems,Dept=SelectedDept)),"[$-en]0") & " active projects · FY2026",
             "projects",   Text(CountRows(Filter(ProjItems,Dept=SelectedDept)),"[$-en]0") & " projects",
             "transfer",   "Submit a request to transfer budget between accounts or projects",
             ""
           )
    Size: =13
    Color: =RGBA(122, 110, 101, 1)

  ##══ KPI STRIP ════════════════════════════
  ## 5 KPI cards: FY Budget | YTD Budget | Actual Spend | Encumbrances | Variance
  ## Visible on overview pages

  KPIContainer:
    Type: GroupContainer
    X: =228
    Y: =152
    Width: =Parent.Width - 248
    Height: =80
    Visible: =ActivePage <> "transfer" && ActivePage <> "corp-depts" && ActivePage <> "proj-depts" && ActivePage <> "accounts" && ActivePage <> "projects"

    KPIfy:
      Type: Label
      X: =0
      Y: =0
      Width: =(Parent.Width - 40) / 5
      Height: =78
      # Inline box styling via border top trick is limited in Power Apps; use fill + top accent
      Fill: =White
      BorderRadius: =10
      Text: |
        ="FY BUDGET" & Char(13) &
        Text(
          Switch(ActivePage,
            "npo",       Sum(CorpAccounts, FY) + Sum(ProjItems, FY),
            "corp-all",  Sum(CorpAccounts, FY),
            "corp-dept", Sum(Filter(CorpAccounts, Dept=SelectedDept), FY),
            "proj-all",  Sum(ProjItems, FY),
            "proj-dept", Sum(Filter(ProjItems, Dept=SelectedDept), FY),
            0
          ),
          "[$-en-US]AED #,##0"
        )
      Align: =Align.Center
      Size: =12

    KPIytd:
      Type: Label
      X: =(Parent.Width - 40) / 5 + 10
      Y: =0
      Width: =(Parent.Width - 40) / 5
      Height: =78
      Fill: =White
      BorderRadius: =10
      Text: |
        ="YTD BUDGET" & Char(13) &
        Text(
          Switch(ActivePage,
            "npo",       Sum(CorpAccounts, YTD) + Sum(ProjItems, YTD),
            "corp-all",  Sum(CorpAccounts, YTD),
            "corp-dept", Sum(Filter(CorpAccounts, Dept=SelectedDept), YTD),
            "proj-all",  Sum(ProjItems, YTD),
            "proj-dept", Sum(Filter(ProjItems, Dept=SelectedDept), YTD),
            0
          ),
          "[$-en-US]AED #,##0"
        )
      Align: =Align.Center
      Size: =12

    KPIact:
      Type: Label
      X: =2 * ((Parent.Width - 40) / 5 + 10)
      Y: =0
      Width: =(Parent.Width - 40) / 5
      Height: =78
      Fill: =White
      BorderRadius: =10
      Text: |
        ="ACTUAL SPEND" & Char(13) &
        Text(
          Switch(ActivePage,
            "npo",       Sum(CorpAccounts, Act) + Sum(ProjItems, Act),
            "corp-all",  Sum(CorpAccounts, Act),
            "corp-dept", Sum(Filter(CorpAccounts, Dept=SelectedDept), Act),
            "proj-all",  Sum(ProjItems, Act),
            "proj-dept", Sum(Filter(ProjItems, Dept=SelectedDept), Act),
            0
          ),
          "[$-en-US]AED #,##0"
        )
      Align: =Align.Center
      Size: =12

    KPIenc:
      Type: Label
      X: =3 * ((Parent.Width - 40) / 5 + 10)
      Y: =0
      Width: =(Parent.Width - 40) / 5
      Height: =78
      Fill: =White
      BorderRadius: =10
      Text: |
        ="ENCUMBRANCES" & Char(13) &
        Text(
          Switch(ActivePage,
            "npo",       Sum(CorpAccounts, Enc) + Sum(ProjItems, Enc),
            "corp-all",  Sum(CorpAccounts, Enc),
            "corp-dept", Sum(Filter(CorpAccounts, Dept=SelectedDept), Enc),
            "proj-all",  Sum(ProjItems, Enc),
            "proj-dept", Sum(Filter(ProjItems, Dept=SelectedDept), Enc),
            0
          ),
          "[$-en-US]AED #,##0"
        )
      Align: =Align.Center
      Size: =12

    KPIvar:
      Type: Label
      X: =4 * ((Parent.Width - 40) / 5 + 10)
      Y: =0
      Width: =(Parent.Width - 40) / 5
      Height: =78
      Fill: =White
      BorderRadius: =10
      Text: |
        ="VARIANCE" & Char(13) &
        Text(
          With({
            ytd: Switch(ActivePage,
              "npo",       Sum(CorpAccounts, YTD) + Sum(ProjItems, YTD),
              "corp-all",  Sum(CorpAccounts, YTD),
              "corp-dept", Sum(Filter(CorpAccounts, Dept=SelectedDept), YTD),
              "proj-all",  Sum(ProjItems, YTD),
              "proj-dept", Sum(Filter(ProjItems, Dept=SelectedDept), YTD),
              0),
            act: Switch(ActivePage,
              "npo",       Sum(CorpAccounts, Act) + Sum(ProjItems, Act),
              "corp-all",  Sum(CorpAccounts, Act),
              "corp-dept", Sum(Filter(CorpAccounts, Dept=SelectedDept), Act),
              "proj-all",  Sum(ProjItems, Act),
              "proj-dept", Sum(Filter(ProjItems, Dept=SelectedDept), Act),
              0)
          }, ytd - act),
          "[$-en-US]AED #,##0"
        )
      Color: =With({
               ytd: Switch(ActivePage,"npo",Sum(CorpAccounts,YTD)+Sum(ProjItems,YTD),"corp-all",Sum(CorpAccounts,YTD),"corp-dept",Sum(Filter(CorpAccounts,Dept=SelectedDept),YTD),"proj-all",Sum(ProjItems,YTD),"proj-dept",Sum(Filter(ProjItems,Dept=SelectedDept),YTD),0),
               act: Switch(ActivePage,"npo",Sum(CorpAccounts,Act)+Sum(ProjItems,Act),"corp-all",Sum(CorpAccounts,Act),"corp-dept",Sum(Filter(CorpAccounts,Dept=SelectedDept),Act),"proj-all",Sum(ProjItems,Act),"proj-dept",Sum(Filter(ProjItems,Dept=SelectedDept),Act),0)
             }, If(ytd - act >= 0, RGBA(59, 109, 17, 1), RGBA(163, 45, 45, 1)))
      Align: =Align.Center
      Size: =12

  ##══ DEPARTMENT CARDS GRID (corp-depts / proj-depts pages) ════════
  DeptCardsGallery:
    Type: Gallery
    Layout: =Layout.Flexible
    Wrap: =true
    X: =228
    Y: =152
    Width: =Parent.Width - 248
    Height: =Parent.Height - 180
    Visible: =ActivePage = "corp-depts" || ActivePage = "proj-depts"
    Items: =If(ActivePage = "corp-depts", CorpDeptSummary, ProjDeptSummary)
    TemplatePadding: =8
    TemplateSize: =130
    ShowScrollbar: =true

    DeptCardRect:
      Type: Rectangle
      Width: =200
      Height: =120
      Fill: =White
      BorderRadius: =10
      BorderColor: =RGBA(228, 221, 210, 1)
      BorderThickness: =1.5
      DropShadow: =DropShadow.Light

    DeptAccentBar:
      Type: Rectangle
      Width: =3
      Height: =120
      Fill: =If(ActivePage = "proj-depts", RGBA(193, 154, 107, 1), RGBA(164, 127, 96, 1))

    DeptCardName:
      Type: Label
      X: =14
      Y: =38
      Width: =180
      Height: =28
      Text: =ThisItem.Dept
      FontWeight: =FontWeight.Semibold
      Size: =13

    DeptCardMeta:
      Type: Label
      X: =14
      Y: =66
      Width: =180
      Height: =18
      Text: =If(
               ActivePage = "corp-depts",
               "CC " & ThisItem.CC & " · " & Text(ThisItem.Accounts,"[$-en]0") & " accounts",
               Text(ThisItem.Projects,"[$-en]0") & " projects"
             ) & " · " & Text(If(ThisItem.YTD>0, Round(ThisItem.Act/ThisItem.YTD*100,0), 0), "[$-en]0") & "% utilized"
      Color: =RGBA(168, 156, 142, 1)
      Size: =11

    DeptCardBar:
      Type: Rectangle
      X: =14
      Y: =90
      Width: =172
      Height: =4
      Fill: =RGBA(228, 221, 210, 1)
      BorderRadius: =2

    DeptCardFill:
      Type: Rectangle
      X: =14
      Y: =90
      Width: =Min(172, 172 * If(ThisItem.YTD>0, ThisItem.Act/ThisItem.YTD, 0))
      Height: =4
      Fill: =If(
               ThisItem.YTD = 0 || ThisItem.Act/ThisItem.YTD < 0.5, RGBA(163, 45, 45, 1),
               ThisItem.Act/ThisItem.YTD < 0.8, RGBA(176, 122, 30, 1),
               RGBA(59, 109, 17, 1)
             )
      BorderRadius: =2

    DeptCardBtn:
      Type: Rectangle
      Width: =200
      Height: =120
      Fill: =Transparent()
      OnSelect: =UpdateContext({
                   SelectedDept: ThisItem.Dept,
                   ActivePage: If(ActivePage = "corp-depts", "corp-dept", "proj-dept"),
                   SelectedItem: Blank()
                 })

  ##══ ACCOUNTS TABLE (accounts page) ══════════════════════════════
  AccountsGallery:
    Type: Gallery
    Layout: =Layout.Vertical
    X: =228
    Y: =152
    Width: =Parent.Width - 248
    Height: =Parent.Height - 168
    Visible: =ActivePage = "accounts"
    Items: =Filter(CorpAccounts, Dept = SelectedDept)
    TemplatePadding: =0
    TemplateSize: =52
    ShowScrollbar: =true

    AccRowBg:
      Type: Rectangle
