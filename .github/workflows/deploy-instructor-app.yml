# Publishes the instructor class tracker (public/instructor) to GitHub Pages.
# The app is static, so nothing is built — the folder is served as the site root.
name: Deploy instructor app

on:
  push:
    branches: [main]
    paths:
      - 'public/instructor/**'
      - '.github/workflows/deploy-instructor-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # artifact.html is the claude.ai edition of the same app; it has no place
      # on a plain web host, where index.html is the one that runs.
      - name: Stage the app
        run: |
          mkdir -p site
          cp -r public/instructor/. site/
          rm -f site/artifact.html
          test -f site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
